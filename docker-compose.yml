services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_DB=eurate
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  db_migration:
    build: .
    command: python manage.py migrate
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      # `web` is the Host the frontend's dev proxy sends.
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,[::1],web
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      db_migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
  frontend:
    image: node:26-alpine
    # Files written to ./frontend belong to the host user; uid/gid 1000 by
    # default, otherwise run `UID=$(id -u) GID=$(id -g) docker compose up`.
    # `npm ci` installs exactly the committed lockfile without rewriting it.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      - API_PROXY_TARGET=http://web:8000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - web
  import_data:
    build: .
    command: python manage.py run_ecb_import
    volumes:
      - .:/code
    depends_on:
      - web

volumes:
  db_data:
    driver: local
